name: release

# Build and publish to PyPI on a version tag, using PyPI Trusted Publishing
# (OIDC) — no API token stored anywhere. Configure the trusted publisher once
# at https://pypi.org/manage/project/codexcomp/settings/publishing/
# (or as a pending publisher before the first release):
#   owner: dzshzx  repo: codexcomp  workflow: release.yml  environment: pypi

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate immutable release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-list -n1 "refs/tags/${RELEASE_TAG}")" = "${RELEASE_SHA}"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/master
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build sdist + wheel
        run: uv build
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl codexcomp --help
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz codexcomp --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
